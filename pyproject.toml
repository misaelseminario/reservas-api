[project]
name = "reservas-api"
version = "0.1.0"
description = "API de reservas de una sala compartida, expuesta por REST y por MCP."
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "sqlalchemy==2.1.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pyjwt==2.15.0",
    "bcrypt==5.0.0",
    "mcp==1.30.0",
    "python-multipart==0.0.32",
    "email-validator==2.3.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]

[tool.coverage.run]
source = ["app"]
